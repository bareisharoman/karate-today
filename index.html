<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KARATE TODAY — Всё о боевых искусствах</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ---------- ОБЩИЕ СТИЛИ ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            color: #f0ece4;
            line-height: 1.6;
            scroll-behavior: smooth;
            /* НОВЫЙ КРАСИВЫЙ ФОН: градиент + текстура "шум" */
            background: 
                radial-gradient(ellipse at 30% 20%, #2a1f0f 0%, #0d0b08 70%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 8px);
            min-height: 100vh;
            background-attachment: fixed;
        }

        .content-wrapper {
            background: rgba(11, 11, 11, 0.6);
            backdrop-filter: blur(1px);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ---------- ПЛАВАЮЩАЯ ШАПКА ---------- */
        header {
            padding: 18px 0;
            border-bottom: 1px solid rgba(212, 167, 67, 0.2);
            position: sticky;
            top: 0;
            background: rgba(11, 11, 11, 0.92);
            backdrop-filter: blur(12px);
            z-index: 1000;
            transition: all 0.4s ease;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #d4a743;
            text-shadow: 0 0 12px rgba(212, 167, 67, 0.25);
            transition: text-shadow 0.3s;
        }
        .logo:hover {
            text-shadow: 0 0 25px rgba(212, 167, 67, 0.5);
        }
        .logo span {
            color: #f0ece4;
        }

        nav a {
            color: #f0ece4;
            text-decoration: none;
            margin-left: 30px;
            font-size: 1.05rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
            padding-bottom: 4px;
            position: relative;
        }
        nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #d4a743;
            transition: width 0.3s ease;
        }
        nav a:hover {
            color: #d4a743;
        }
        nav a:hover::after {
            width: 100%;
        }

        /* ---------- ГЕРОЙ ---------- */
        .hero {
            padding: 110px 0 90px;
            text-align: center;
            background: radial-gradient(circle at 30% 20%, rgba(40,30,15,0.3) 0%, rgba(11,11,11,0.7) 80%);
            border-bottom: 1px solid rgba(212, 167, 67, 0.15);
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '⚔️';
            position: absolute;
            font-size: 18rem;
            opacity: 0.04;
            top: -60px;
            right: -60px;
            transform: rotate(15deg);
            pointer-events: none;
        }

        .hero h1 {
            font-size: 4.6rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #d4a743;
            text-shadow: 0 0 40px rgba(212, 167, 67, 0.15);
            margin-bottom: 20px;
            animation: fadeInUp 1s ease-out;
        }

        .hero h1 .hero-icon {
            display: inline-block;
            font-size: 4.2rem;
            margin-right: 15px;
            vertical-align: middle;
            animation: pulse-fist 2.8s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(212, 167, 67, 0.2));
        }

        @keyframes pulse-fist {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.12) rotate(-6deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .hero h1 small {
            display: block;
            font-size: 1.8rem;
            color: #f0ece4;
            letter-spacing: 10px;
            margin-top: 12px;
            font-weight: 300;
        }

        .hero p {
            font-size: 1.4rem;
            max-width: 700px;
            margin: 0 auto 45px;
            color: #c5bdb0;
            animation: fadeInUp 1.2s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- КНОПКИ ---------- */
        .btn {
            display: inline-block;
            background: #d4a743;
            color: #0b0b0b;
            padding: 16px 52px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 2px solid #d4a743;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(212, 167, 67, 0.15);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255,215,0,0.15) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.6s;
            transform: scale(0.5);
        }

        .btn:hover {
            background: transparent;
            color: #d4a743;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 0 45px rgba(212, 167, 67, 0.3);
            border-color: #d4a743;
        }
        .btn:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        .btn-outline {
            background: transparent;
            color: #d4a743;
            border-color: #d4a743;
            margin-left: 18px;
            box-shadow: none;
        }

        .btn-outline:hover {
            background: #d4a743;
            color: #0b0b0b;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 0 45px rgba(212, 167, 67, 0.2);
        }

        /* ---------- СЕКЦИИ ---------- */
        section {
            padding: 90px 0;
            border-bottom: 1px solid rgba(30,30,30,0.6);
            position: relative;
        }

        .section-title {
            font-size: 2.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #d4a743;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 20px rgba(212, 167, 67, 0.06);
        }

        .section-sub {
            text-align: center;
            color: #b5aea2;
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto 55px;
        }

        /* ---------- О КАНАЛЕ ---------- */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-text p {
            font-size: 1.15rem;
            margin-bottom: 20px;
            color: #ccc6ba;
        }

        .about-text strong {
            color: #d4a743;
        }

        .about-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stat-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(2px);
            padding: 35px 20px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid rgba(42,42,42,0.5);
            transition: all 0.4s ease;
        }
        .stat-card:hover {
            transform: translateY(-6px);
            border-color: #d4a743;
            box-shadow: 0 0 30px rgba(212, 167, 67, 0.06);
        }

        .stat-card .number {
            font-size: 3rem;
            font-weight: 700;
            color: #d4a743;
            display: block;
        }

        .stat-card .label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a847a;
        }

        /* ---------- ССЫЛКИ ---------- */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .link-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(2px);
            padding: 35px 20px;
            border-radius: 16px;
            border: 1px solid rgba(42,42,42,0.5);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-decoration: none;
            color: #f0ece4;
            display: block;
            position: relative;
            overflow: hidden;
        }
        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(212,167,67,0.05) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.5s;
        }
        .link-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #d4a743;
            box-shadow: 0 0 40px rgba(212, 167, 67, 0.08);
            background: rgba(30, 30, 30, 0.7);
        }
        .link-card:hover::before {
            opacity: 1;
        }

        .link-card .icon {
            font-size: 3.8rem;
            display: block;
            margin-bottom: 15px;
            transition: transform 0.4s ease;
        }
        .link-card:hover .icon {
            transform: scale(1.15) rotate(-4deg);
        }

        .link-card .title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #d4a743;
            display: block;
            margin-bottom: 8px;
        }

        .link-card .desc {
            font-size: 0.95rem;
            color: #b5aea2;
        }

        /* ---------- НОВОСТИ ---------- */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .news-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(2px);
            padding: 30px 25px;
            border-radius: 16px;
            border-left: 5px solid #d4a743;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .news-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, rgba(212,167,67,0.03) 0%, transparent 70%);
            pointer-events: none;
        }
        .news-card:hover {
            transform: translateX(10px) scale(1.01);
            border-color: #f0ece4;
            box-shadow: 0 0 35px rgba(212, 167, 67, 0.05);
        }

        .news-card .title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f0ece4;
            display: block;
            margin-bottom: 8px;
        }

        .news-card .date {
            font-size: 1rem;
            color: #d4a743;
            display: block;
            margin-bottom: 6px;
        }

        .news-card .source {
            font-size: 0.9rem;
            color: #8a847a;
        }
        .news-card .source a {
            color: #d4a743;
            text-decoration: none;
        }
        .news-card .source a:hover {
            text-decoration: underline;
        }

        /* ---------- КОБУДО ---------- */
        .org-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
        }

        .org-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(2px);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid rgba(42,42,42,0.5);
            text-align: center;
            transition: all 0.4s ease;
        }

        .org-card:hover {
            transform: translateY(-6px);
            border-color: #d4a743;
            box-shadow: 0 0 40px rgba(212, 167, 67, 0.06);
        }

        .org-card .icon {
            font-size: 4rem;
            margin-bottom: 15px;
            display: block;
        }

        .org-card h3 {
            font-size: 1.8rem;
            color: #d4a743;
            margin-bottom: 15px;
        }

        .org-card p {
            color: #b5aea2;
            font-size: 1.05rem;
        }

        /* ---------- АВТОР ---------- */
        .coach-wrap {
            display: flex;
            gap: 50px;
            align-items: flex-start;
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(2px);
            padding: 45px;
            border-radius: 20px;
            border: 1px solid rgba(42,42,42,0.5);
            transition: all 0.4s ease;
        }

        .coach-wrap:hover {
            border-color: #d4a743;
            box-shadow: 0 0 40px rgba(212, 167, 67, 0.05);
        }

        .coach-wrap .avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5.5rem;
            flex-shrink: 0;
            border: 3px solid #d4a743;
            box-shadow: 0 0 30px rgba(212, 167, 67, 0.08);
            transition: transform 0.4s ease;
        }
        .coach-wrap:hover .avatar {
            transform: scale(1.04);
        }

        .coach-wrap .bio h3 {
            font-size: 2.2rem;
            color: #d4a743;
            margin-bottom: 5px;
        }

        .coach-wrap .bio .rank {
            font-size: 1.2rem;
            color: #d4a743;
            margin-bottom: 15px;
            display: block;
            opacity: 0.8;
        }

        .coach-wrap .bio p {
            color: #b5aea2;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .coach-wrap .bio ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            color: #b5aea2;
        }

        .coach-wrap .bio ul li {
            margin-bottom: 8px;
            font-size: 1.05rem;
            padding-left: 8px;
        }

        .coach-wrap .bio .slogan {
            margin-top: 18px;
            font-weight: 700;
            color: #d4a743;
            font-size: 1.2rem;
        }

        /* ---------- КОНТАКТЫ ---------- */
        .contacts {
            text-align: center;
        }

        .contacts .socials {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .contacts .socials a {
            color: #b5aea2;
            text-decoration: none;
            font-size: 1.2rem;
            letter-spacing: 1px;
            border-bottom: 2px solid transparent;
            padding-bottom: 4px;
            transition: all 0.3s ease;
        }

        .contacts .socials a:hover {
            color: #d4a743;
            border-bottom-color: #d4a743;
            transform: translateY(-3px);
        }

        /* ---------- КНОПКА "НАВЕРХ" ---------- */
        #topBtn {
            display: none;
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 999;
            background: #d4a743;
            color: #0b0b0b;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 2.2rem;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(212, 167, 67, 0.25);
            transition: all 0.3s ease;
            line-height: 1;
        }

        #topBtn:hover {
            transform: scale(1.15) translateY(-4px);
            background: #f0ece4;
            box-shadow: 0 0 50px rgba(212, 167, 67, 0.4);
        }

        /* ---------- ФУТЕР ---------- */
        footer {
            padding: 45px 0;
            text-align: center;
            color: #5a544a;
            font-size: 0.95rem;
            border-top: 1px solid rgba(30,30,30,0.6);
        }

        footer span {
            color: #d4a743;
        }

        /* ---------- АДАПТИВ ---------- */
        @media (max-width: 900px) {
            .about-grid, .org-wrap {
                grid-template-columns: 1fr;
            }
            .coach-wrap {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 30px;
            }
            .coach-wrap .bio ul {
                text-align: left;
                padding-left: 20px;
            }
            .hero h1 {
                font-size: 2.8rem;
            }
            .hero h1 .hero-icon {
                font-size: 2.8rem;
                margin-right: 10px;
            }
            .hero h1 small {
                font-size: 1.3rem;
            }
            .hero p {
                font-size: 1.2rem;
            }
            .header-inner {
                flex-direction: column;
                gap: 16px;
            }
            nav a {
                margin: 0 12px;
                font-size: 0.95rem;
            }
            .btn-outline {
                margin-left: 0;
                margin-top: 12px;
            }
            .btn {
                padding: 14px 35px;
                font-size: 1rem;
            }
            #topBtn {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 1.8rem;
            }
            .hero::before {
                font-size: 10rem;
                top: -30px;
                right: -30px;
            }
        }

        @media (max-width: 500px) {
            .hero {
                padding: 60px 0;
            }
            .hero h1 {
                font-size: 2rem;
            }
            .hero h1 .hero-icon {
                font-size: 2.2rem;
                margin-right: 8px;
            }
            .hero h1 small {
                font-size: 1rem;
                letter-spacing: 4px;
            }
            .section-title {
                font-size: 2rem;
            }
            .about-stats {
                grid-template-columns: 1fr;
            }
            .coach-wrap .bio ul {
                padding-left: 10px;
            }
            .btn {
                padding: 10px 22px;
                font-size: 0.85rem;
            }
            .links-grid {
                grid-template-columns: 1fr 1fr;
            }
            .news-grid {
                grid-template-columns: 1fr;
            }
            .coach-wrap .avatar {
                width: 120px;
                height: 120px;
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- ВСЁ ОСТАЛЬНОЕ СОДЕРЖИМОЕ (HTML) ОСТАЁТСЯ ТОЧНО ТАКИМ ЖЕ, КАК В ПРЕДЫДУЩЕМ ОТВЕТЕ -->
